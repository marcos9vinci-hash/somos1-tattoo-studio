<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Somos 1 Tattoo Studio</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/somos1-logo.png" />
    <link rel="apple-touch-icon" href="/somos1-logo-official.png" />
    <meta name="description" content="Somos 1 Tattoo Studio - Super App Oficial de Gestão, Agenda e Galeria IA" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="root">
      <div style="background-color: #000000; min-height: 100vh; width: 100vw; position: fixed; top: 0; left: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; z-index: 9999;">
        <img src="/somos1-logo-official.png" alt="Somos 1 Tattoo Studio" style="width: 290px; max-width: 85vw; height: auto; filter: drop-shadow(0 0 30px rgba(255, 255, 255, 0.2)); animation: pulseLogo 2s infinite ease-in-out;" />
      </div>
      <style>
        @keyframes pulseLogo {
          0%, 100% { opacity: 0.88; transform: scale(0.98); }
          50% { opacity: 1; transform: scale(1.02); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
