name: WhatsApp Automation Bot
on:
  schedule:
    - cron: '*/30 * * * *'
  repository_dispatch:
    types: [trigger-whatsapp-bot]
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install firebase axios
      - run: node bot-envio.js
